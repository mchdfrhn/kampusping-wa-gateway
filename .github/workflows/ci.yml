name: CI

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint, type check, format check, unit tests
        run: npm run check

      - name: Build
        run: npm run build
